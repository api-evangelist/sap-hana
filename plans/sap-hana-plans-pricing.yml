provider: SAP HANA
providerId: sap-hana
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
- Analytics
- Database
- Enterprise
- In-Memory
- SAP
description: SAP HANA does not publish self-service plans or pricing reachable in this reconciliation
  pass; commercial terms are handled by direct sales engagement. This artifact is intentionally trimmed
  to a single Contact Sales plan.
notes: SAP HANA Cloud pricing is gated behind the SAP Discovery Center / SAP Store and SAP corporate sales;
  the public sap.com pricing page returns HTTP 403 to anonymous fetches and Discovery Center requires
  authenticated session. Pricing is contract-based via SAP Store / sales engagement.
sources:
- https://www.sap.com/products/technology-platform/hana.html
- https://discovery-center.cloud.sap/serviceCatalog/sap-hana-cloud
plans:
- id: sap-hana-contact-sales
  name: Contact Sales
  type: enterprise
  description: Contact SAP HANA sales for commercial terms. No self-service plan or public unit pricing
    is available.
  entries:
  - label: Negotiated Commercial Terms
    name: negotiated_terms
    type: subscription
    metric: varies
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Custom-negotiated capacity
  - name: Enterprise support
  - name: Contractual SLA
