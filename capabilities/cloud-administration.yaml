naftiko: 1.0.0-alpha2
info:
  label: SAP HANA Cloud Administration
  description: Unified workflow for SAP HANA Cloud database administration including instance lifecycle management, monitoring
    alerts, performance metrics, and metering. Used by database administrators and cloud platform engineers.
  tags:
  - SAP HANA
  - Cloud
  - Administration
  - Monitoring
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SAP_HANA_OAUTH_TOKEN: SAP_HANA_OAUTH_TOKEN
capability:
  consumes:
  - type: http
    namespace: hana-cloud-rest
    baseUri: https://api.cf.eu10.hana.ondemand.com
    description: SAP HANA Cloud REST API for managing instances, alerts, metrics, and metering.
    authentication:
      type: bearer
      token: '{{SAP_HANA_OAUTH_TOKEN}}'
    resources:
    - name: instances
      path: /v1/service_instances
      description: Service instance lifecycle management.
      operations:
      - name: list-service-instances
        method: GET
        description: List all SAP HANA Cloud service instances.
        inputParameters:
        - name: fieldQuery
          in: query
          type: string
          required: false
          description: Filter query for instance fields.
        - name: labelQuery
          in: query
          type: string
          required: false
          description: Filter query for instance labels.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-service-instance
        method: POST
        description: Provision a new SAP HANA Cloud service instance.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            service_plan_id: '{{tools.service_plan_id}}'
            parameters: '{{tools.parameters}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instance-details
      path: /v1/service_instances/{instanceId}
      description: Individual instance operations.
      operations:
      - name: get-service-instance
        method: GET
        description: Retrieve details of a specific service instance.
        inputParameters:
        - name: instanceId
          in: path
          type: string
          required: true
          description: The service instance ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-service-instance
        method: PATCH
        description: Update configuration of a service instance.
        inputParameters:
        - name: instanceId
          in: path
          type: string
          required: true
          description: The service instance ID.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            parameters: '{{tools.parameters}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-service-instance
        method: DELETE
        description: Delete a service instance and all associated data.
        inputParameters:
        - name: instanceId
          in: path
          type: string
          required: true
          description: The service instance ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: inventory
      path: /inventory/v2/serviceInstances
      description: Inventory listing of all instances.
      operations:
      - name: list-inventory-instances
        method: GET
        description: List all instances in the inventory.
        inputParameters:
        - name: provisioningState
          in: query
          type: string
          required: false
          description: Filter by provisioning state.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alerts
      path: /alerts/v1/events
      description: Alert event operations.
      operations:
      - name: list-alert-events
        method: GET
        description: List triggered alert events.
        inputParameters:
        - name: instanceId
          in: query
          type: string
          required: true
          description: The instance ID to get alerts for.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alert-rules
      path: /alerts/v1/rules
      description: Alert rule management.
      operations:
      - name: list-alert-rules
        method: GET
        description: List alert rules.
        inputParameters:
        - name: instanceId
          in: query
          type: string
          required: true
          description: The instance ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-alert-rules
        method: PUT
        description: Update alert rules for an instance.
        inputParameters:
        - name: instanceId
          in: query
          type: string
          required: true
          description: The instance ID.
        body:
          type: json
          data:
            rules: '{{tools.rules}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: metrics
      path: /metrics/v1/values
      description: Database metrics operations.
      operations:
      - name: get-metric-values
        method: GET
        description: Retrieve database performance metrics.
        inputParameters:
        - name: instanceId
          in: query
          type: string
          required: true
          description: The instance ID.
        - name: metricName
          in: query
          type: string
          required: true
          description: Name of the metric to retrieve.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: metering
      path: /metering/v1/values
      description: Consumption metering data.
      operations:
      - name: get-metering-values
        method: GET
        description: Retrieve consumption metering data.
        inputParameters:
        - name: instanceId
          in: query
          type: string
          required: true
          description: The instance ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instance-mappings
      path: /v1/instance_mappings
      description: Instance mapping operations.
      operations:
      - name: list-instance-mappings
        method: GET
        description: List instance mappings.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-instance-mapping
        method: POST
        description: Create a new instance mapping.
        body:
          type: json
          data:
            sourceInstanceId: '{{tools.sourceInstanceId}}'
            targetInstanceId: '{{tools.targetInstanceId}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-instance-mapping
        method: DELETE
        description: Delete an instance mapping.
        inputParameters:
        - name: mappingId
          in: path
          type: string
          required: true
          description: The mapping ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: hana-cloud-admin-api
    description: Unified REST API for SAP HANA Cloud administration.
    resources:
    - path: /v1/instances
      name: instances
      description: Instance lifecycle management.
      operations:
      - method: GET
        name: list-instances
        description: List all SAP HANA Cloud instances.
        call: hana-cloud-rest.list-service-instances
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-instance
        description: Provision a new instance.
        call: hana-cloud-rest.create-service-instance
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/instances/{instanceId}
      name: instance-details
      description: Individual instance operations.
      operations:
      - method: GET
        name: get-instance
        description: Get instance details.
        call: hana-cloud-rest.get-service-instance
        with:
          instanceId: rest.instanceId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: update-instance
        description: Update an instance.
        call: hana-cloud-rest.update-service-instance
        with:
          instanceId: rest.instanceId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-instance
        description: Delete an instance.
        call: hana-cloud-rest.delete-service-instance
        with:
          instanceId: rest.instanceId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/alerts
      name: alerts
      description: Alert monitoring.
      operations:
      - method: GET
        name: list-alerts
        description: List alert events.
        call: hana-cloud-rest.list-alert-events
        with:
          instanceId: rest.instanceId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/metrics
      name: metrics
      description: Performance metrics.
      operations:
      - method: GET
        name: get-metrics
        description: Get database metrics.
        call: hana-cloud-rest.get-metric-values
        with:
          instanceId: rest.instanceId
          metricName: rest.metricName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: hana-cloud-admin-mcp
    transport: http
    description: MCP server for AI-assisted SAP HANA Cloud database administration.
    tools:
    - name: list-instances
      description: List all SAP HANA Cloud service instances.
      hints:
        readOnly: true
        openWorld: true
      call: hana-cloud-rest.list-service-instances
      outputParameters:
      - type: object
        mapping: $.
    - name: create-instance
      description: Provision a new SAP HANA Cloud instance.
      hints:
        readOnly: false
      call: hana-cloud-rest.create-service-instance
      outputParameters:
      - type: object
        mapping: $.
    - name: get-instance
      description: Get details of a specific instance.
      hints:
        readOnly: true
      call: hana-cloud-rest.get-service-instance
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-instance
      description: Update instance configuration.
      hints:
        readOnly: false
        idempotent: true
      call: hana-cloud-rest.update-service-instance
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-instance
      description: Delete a service instance permanently.
      hints:
        destructive: true
        idempotent: true
      call: hana-cloud-rest.delete-service-instance
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-inventory
      description: List all instances in the inventory.
      hints:
        readOnly: true
      call: hana-cloud-rest.list-inventory-instances
      outputParameters:
      - type: object
        mapping: $.
    - name: list-alerts
      description: List triggered alert events for an instance.
      hints:
        readOnly: true
      call: hana-cloud-rest.list-alert-events
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-alert-rules
      description: List alert rules for an instance.
      hints:
        readOnly: true
      call: hana-cloud-rest.list-alert-rules
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-alert-rules
      description: Update alert rules for an instance.
      hints:
        readOnly: false
        idempotent: true
      call: hana-cloud-rest.update-alert-rules
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-metrics
      description: Retrieve database performance metrics.
      hints:
        readOnly: true
      call: hana-cloud-rest.get-metric-values
      with:
        instanceId: tools.instanceId
        metricName: tools.metricName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-metering
      description: Retrieve consumption metering data.
      hints:
        readOnly: true
      call: hana-cloud-rest.get-metering-values
      with:
        instanceId: tools.instanceId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-mappings
      description: List instance mappings.
      hints:
        readOnly: true
      call: hana-cloud-rest.list-instance-mappings
      outputParameters:
      - type: object
        mapping: $.
    - name: create-mapping
      description: Create a new instance mapping.
      hints:
        readOnly: false
      call: hana-cloud-rest.create-instance-mapping
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-mapping
      description: Delete an instance mapping.
      hints:
        destructive: true
        idempotent: true
      call: hana-cloud-rest.delete-instance-mapping
      with:
        mappingId: tools.mappingId
      outputParameters:
      - type: object
        mapping: $.
