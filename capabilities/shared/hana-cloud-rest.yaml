naftiko: "1.0.0-alpha1"

info:
  label: "SAP HANA Cloud REST API"
  description: "Consumed definition for the SAP HANA Cloud REST API covering instance management, alerts, metrics, metering, and instance mappings."
  tags:
    - SAP HANA
    - Cloud
    - Database Management
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      SAP_HANA_OAUTH_TOKEN: SAP_HANA_OAUTH_TOKEN

capability:
  consumes:
    - type: http
      namespace: hana-cloud-rest
      baseUri: https://api.cf.eu10.hana.ondemand.com
      description: "SAP HANA Cloud REST API for managing instances, alerts, metrics, and metering."
      authentication:
        type: bearer
        token: "{{SAP_HANA_OAUTH_TOKEN}}"
      resources:
        - name: instances
          path: /v1/service_instances
          description: "Service instance lifecycle management."
          operations:
            - name: list-service-instances
              method: GET
              description: "List all SAP HANA Cloud service instances."
              inputParameters:
                - name: fieldQuery
                  in: query
                  type: string
                  required: false
                  description: "Filter query for instance fields."
                - name: labelQuery
                  in: query
                  type: string
                  required: false
                  description: "Filter query for instance labels."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-service-instance
              method: POST
              description: "Provision a new SAP HANA Cloud service instance."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  service_plan_id: "{{tools.service_plan_id}}"
                  parameters: "{{tools.parameters}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: instance-details
          path: /v1/service_instances/{instanceId}
          description: "Individual instance operations."
          operations:
            - name: get-service-instance
              method: GET
              description: "Retrieve details of a specific service instance."
              inputParameters:
                - name: instanceId
                  in: path
                  type: string
                  required: true
                  description: "The service instance ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-service-instance
              method: PATCH
              description: "Update configuration of a service instance."
              inputParameters:
                - name: instanceId
                  in: path
                  type: string
                  required: true
                  description: "The service instance ID."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  parameters: "{{tools.parameters}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-service-instance
              method: DELETE
              description: "Delete a service instance and all associated data."
              inputParameters:
                - name: instanceId
                  in: path
                  type: string
                  required: true
                  description: "The service instance ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: inventory
          path: /inventory/v2/serviceInstances
          description: "Inventory listing of all instances."
          operations:
            - name: list-inventory-instances
              method: GET
              description: "List all instances in the inventory."
              inputParameters:
                - name: provisioningState
                  in: query
                  type: string
                  required: false
                  description: "Filter by provisioning state."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: alerts
          path: /alerts/v1/events
          description: "Alert event operations."
          operations:
            - name: list-alert-events
              method: GET
              description: "List triggered alert events."
              inputParameters:
                - name: instanceId
                  in: query
                  type: string
                  required: true
                  description: "The instance ID to get alerts for."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: alert-rules
          path: /alerts/v1/rules
          description: "Alert rule management."
          operations:
            - name: list-alert-rules
              method: GET
              description: "List alert rules."
              inputParameters:
                - name: instanceId
                  in: query
                  type: string
                  required: true
                  description: "The instance ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-alert-rules
              method: PUT
              description: "Update alert rules for an instance."
              inputParameters:
                - name: instanceId
                  in: query
                  type: string
                  required: true
                  description: "The instance ID."
              body:
                type: json
                data:
                  rules: "{{tools.rules}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: metrics
          path: /metrics/v1/values
          description: "Database metrics operations."
          operations:
            - name: get-metric-values
              method: GET
              description: "Retrieve database performance metrics."
              inputParameters:
                - name: instanceId
                  in: query
                  type: string
                  required: true
                  description: "The instance ID."
                - name: metricName
                  in: query
                  type: string
                  required: true
                  description: "Name of the metric to retrieve."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: metering
          path: /metering/v1/values
          description: "Consumption metering data."
          operations:
            - name: get-metering-values
              method: GET
              description: "Retrieve consumption metering data."
              inputParameters:
                - name: instanceId
                  in: query
                  type: string
                  required: true
                  description: "The instance ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: instance-mappings
          path: /v1/instance_mappings
          description: "Instance mapping operations."
          operations:
            - name: list-instance-mappings
              method: GET
              description: "List instance mappings."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-instance-mapping
              method: POST
              description: "Create a new instance mapping."
              body:
                type: json
                data:
                  sourceInstanceId: "{{tools.sourceInstanceId}}"
                  targetInstanceId: "{{tools.targetInstanceId}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-instance-mapping
              method: DELETE
              description: "Delete an instance mapping."
              inputParameters:
                - name: mappingId
                  in: path
                  type: string
                  required: true
                  description: "The mapping ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: hana-cloud-rest-api
      resources:
        - path: /v1/instances
          name: instances
          description: "Instance management."
          operations:
            - method: GET
              name: list-instances
              description: "List all instances."
              call: "hana-cloud-rest.list-service-instances"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: hana-cloud-rest-mcp
      transport: http
      tools:
        - name: list-service-instances
          description: "List all SAP HANA Cloud service instances."
          hints:
            readOnly: true
            openWorld: true
          call: "hana-cloud-rest.list-service-instances"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-service-instance
          description: "Provision a new SAP HANA Cloud instance."
          hints:
            readOnly: false
          call: "hana-cloud-rest.create-service-instance"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-service-instance
          description: "Get details of a specific instance."
          hints:
            readOnly: true
          call: "hana-cloud-rest.get-service-instance"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-service-instance
          description: "Update instance configuration."
          hints:
            readOnly: false
            idempotent: true
          call: "hana-cloud-rest.update-service-instance"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-service-instance
          description: "Delete a service instance."
          hints:
            destructive: true
            idempotent: true
          call: "hana-cloud-rest.delete-service-instance"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-inventory-instances
          description: "List all instances in the inventory."
          hints:
            readOnly: true
          call: "hana-cloud-rest.list-inventory-instances"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-alert-events
          description: "List triggered alert events for an instance."
          hints:
            readOnly: true
          call: "hana-cloud-rest.list-alert-events"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-alert-rules
          description: "List alert rules for an instance."
          hints:
            readOnly: true
          call: "hana-cloud-rest.list-alert-rules"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-alert-rules
          description: "Update alert rules for an instance."
          hints:
            readOnly: false
            idempotent: true
          call: "hana-cloud-rest.update-alert-rules"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-metric-values
          description: "Retrieve database performance metrics."
          hints:
            readOnly: true
          call: "hana-cloud-rest.get-metric-values"
          with:
            instanceId: "tools.instanceId"
            metricName: "tools.metricName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-metering-values
          description: "Retrieve consumption metering data."
          hints:
            readOnly: true
          call: "hana-cloud-rest.get-metering-values"
          with:
            instanceId: "tools.instanceId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-instance-mappings
          description: "List instance mappings."
          hints:
            readOnly: true
          call: "hana-cloud-rest.list-instance-mappings"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-instance-mapping
          description: "Create a new instance mapping."
          hints:
            readOnly: false
          call: "hana-cloud-rest.create-instance-mapping"
          outputParameters:
            - type: object
              mapping: "$."
        - name: delete-instance-mapping
          description: "Delete an instance mapping."
          hints:
            destructive: true
            idempotent: true
          call: "hana-cloud-rest.delete-instance-mapping"
          with:
            mappingId: "tools.mappingId"
          outputParameters:
            - type: object
              mapping: "$."
