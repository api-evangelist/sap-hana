specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SAP HANA
providerId: sap-hana
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
- Database
- Enterprise
- SAP
- Rate Limiting
description: SAP HANA does not publish public API rate limits reachable in this reconciliation pass; limits
  are governed by the customer's commercial / partner agreement. Consumers should honor 429 / 503 responses
  where they appear and follow standard exponential-backoff guidance.
notes: SAP HANA Cloud pricing is gated behind the SAP Discovery Center / SAP Store and SAP corporate sales;
  the public sap.com pricing page returns HTTP 403 to anonymous fetches and Discovery Center requires
  authenticated session. Pricing is contract-based via SAP Store / sales engagement.
sources:
- https://www.sap.com/products/technology-platform/hana.html
- https://discovery-center.cloud.sap/serviceCatalog/sap-hana-cloud
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
- name: Contracted limits
  scope: account
  metric: varies
  limit: negotiated under commercial / partner agreement; not publicly published
policies:
- name: Backoff on 429
  description: Clients should implement exponential backoff with jitter on HTTP 429 responses, honoring
    the Retry-After header when present.
- name: Quota raise via account team
  description: Quota and rate-limit changes are coordinated through the SAP HANA account team or partner
    manager rather than self-service.
